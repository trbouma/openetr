  <title id="title">OpenETR QR code shown to scale on a 750 millilitre wine bottle</title>
  <desc id="description">A representative 300 millimetre tall and 75 millimetre wide wine bottle with a 24 millimetre OpenETR QR code and a 30 millimetre scratch panel outline.</desc>
