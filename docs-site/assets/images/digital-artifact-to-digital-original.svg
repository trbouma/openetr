<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Digital Artifact to Digital Original</title>
  <desc id="desc">An OpenETR diagram showing a Digital Artifact referenced by a Digital Controllable Record spanning its signed lifecycle. Validation of that record or graph against an applicable policy produces consequential state, which enables recognition and effect and establishes a Digital Original.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="object" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf1f7"/>
      <stop offset="1" stop-color="#f7f9fc"/>
    </linearGradient>
    <linearGradient id="effect" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f8e8"/>
      <stop offset="1" stop-color="#f3fbf2"/>
    </linearGradient>
    <linearGradient id="effectChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#caebc9"/>
      <stop offset="1" stop-color="#e3f5e1"/>
    </linearGradient>
    <linearGradient id="control" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5f4ff"/>
      <stop offset="1" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="controlChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9dcfb"/>
      <stop offset="1" stop-color="#d8edff"/>
    </linearGradient>
    <linearGradient id="controlledObject" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9defa"/>
      <stop offset="0.5" stop-color="#f3ecff"/>
      <stop offset="1" stop-color="#e9defa"/>
    </linearGradient>
    <linearGradient id="original" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0bd"/>
      <stop offset="1" stop-color="#fff8df"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#243a5a" flood-opacity="0.12"/>
    </filter>
    <style>
      .ink { fill: #071124; }
      .muted { fill: #546173; }
      .fine { fill: #263244; }
      .title { font: 800 52px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { font: 500 28px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .panel-title { font: 800 29px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .panel-subtitle { font: 500 21px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .chip { font: 800 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .role-title { font: 800 23px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .role-subtitle { font: 600 19px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card-title { font: 800 25px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card-subtitle { font: 700 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { font: 500 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body-strong { font: 800 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font: 500 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .rule { stroke: #95a3b8; stroke-width: 1.4; }
      .arrow { stroke: #071124; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke: #071124; stroke-width: 3; fill: none; stroke-linecap: round; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <text x="800" y="58" text-anchor="middle" class="title ink">Digital Artifact -&gt; Digital Original</text>
  <text x="800" y="104" text-anchor="middle" class="subtitle muted">Validate the DCR against policy. Consequential state enables recognition and effect.</text>

  <rect x="40" y="178" width="250" height="290" rx="10" fill="url(#object)" filter="url(#shadow)"/>
  <text x="90" y="262" class="panel-title ink">Digital</text>
  <text x="90" y="302" class="panel-title ink">Artifact</text>
  <text x="90" y="356" class="panel-subtitle ink">Persistent content</text>
  <text x="90" y="384" class="panel-subtitle ink">identified by digest.</text>

  <path class="arrow" d="M290 341h64"/>
  <path class="arrow" d="M336 318l24 23-24 23"/>

  <rect x="360" y="132" width="880" height="154" rx="14" fill="url(#effect)" filter="url(#shadow)"/>
  <text x="800" y="171" text-anchor="middle" class="panel-title ink">Recognition And Effect</text>
  <text x="800" y="202" text-anchor="middle" class="panel-subtitle ink">A relying party accepts consequential state and gives it external effect.</text>
  <rect x="386" y="220" width="250" height="44" rx="8" fill="url(#effectChip)"/>
  <rect x="675" y="220" width="250" height="44" rx="8" fill="url(#effectChip)"/>
  <rect x="964" y="220" width="250" height="44" rx="8" fill="url(#effectChip)"/>
  <text x="511" y="249" text-anchor="middle" class="chip ink">Recognition</text>
  <text x="800" y="249" text-anchor="middle" class="chip ink">Standing</text>
  <text x="1089" y="249" text-anchor="middle" class="chip ink">Effect</text>

  <path class="dash" d="M800 316v-24"/>
  <path class="arrow" d="M788 300l12-12 12 12"/>
  <text x="822" y="307" class="small ink">Policy validation produces consequential state</text>

  <rect x="360" y="318" width="880" height="46" rx="12" fill="url(#controlledObject)" stroke="#76549f" stroke-width="2"/>
  <text x="800" y="348" text-anchor="middle" class="ink">
    <tspan class="role-title">Digital Controllable Record</tspan>
    <tspan class="role-subtitle"> — one end-verifiable record or graph spanning the signed lifecycle</tspan>
  </text>
  <rect x="360" y="370" width="880" height="168" rx="14" fill="url(#control)" filter="url(#shadow)"/>
  <text x="800" y="410" text-anchor="middle" class="panel-title ink">End-Verifiable DCR Evidence</text>
  <text x="800" y="438" text-anchor="middle" class="panel-subtitle ink">The record or graph is evaluated as a whole in relation to policy.</text>
  <rect x="380" y="458" width="160" height="58" rx="8" fill="url(#controlChip)"/>
  <rect x="554" y="458" width="160" height="58" rx="8" fill="url(#controlChip)"/>
  <rect x="728" y="458" width="160" height="58" rx="8" fill="url(#controlChip)"/>
  <rect x="902" y="458" width="160" height="58" rx="8" fill="url(#controlChip)"/>
  <rect x="1076" y="458" width="144" height="58" rx="8" fill="url(#controlChip)"/>
  <text x="460" y="494" text-anchor="middle" class="chip ink">Anchor</text>
  <text x="634" y="494" text-anchor="middle" class="chip ink">Transfer</text>
  <text x="808" y="494" text-anchor="middle" class="chip ink">Encumber</text>
  <text x="982" y="494" text-anchor="middle" class="chip ink">Discharge</text>
  <text x="1148" y="494" text-anchor="middle" class="chip ink">Terminate</text>

  <path class="arrow" d="M1240 341h64"/>
  <path class="arrow" d="M1286 318l24 23-24 23"/>

  <rect x="1310" y="178" width="250" height="290" rx="10" fill="url(#original)" filter="url(#shadow)"/>
  <text x="1385" y="252" class="panel-title ink">Digital</text>
  <text x="1385" y="292" class="panel-title ink">Original</text>
  <text x="1340" y="350" class="panel-subtitle ink">A Digital Artifact</text>
  <text x="1340" y="378" class="panel-subtitle ink">with consequential</text>
  <text x="1340" y="406" class="panel-subtitle ink">state derived from</text>
  <text x="1340" y="434" class="panel-subtitle ink">its valid DCR.</text>

  <rect x="40" y="568" width="310" height="300" rx="8" fill="url(#object)" filter="url(#shadow)"/>
  <text x="62" y="602" class="card-title ink">Digital Artifact</text>
  <text x="62" y="628" class="card-subtitle ink">Definition</text>
  <text x="62" y="670" class="body fine">Persistent digital content is</text>
  <text x="62" y="694" class="body fine">identified by a cryptographic</text>
  <text x="62" y="718" class="body fine">digest. Copies with the same</text>
  <text x="62" y="742" class="body fine">digest represent the same</text>
  <text x="62" y="766" class="body fine">Digital Artifact but do not</text>
  <text x="62" y="790" class="body fine">copy consequential state.</text>

  <rect x="370" y="568" width="950" height="300" rx="8" fill="url(#control)" filter="url(#shadow)"/>
  <text x="392" y="602" class="card-title ink">Digital Controllable Record</text>
  <text x="392" y="628" class="card-subtitle ink">The evidence spans the lifecycle; validation produces consequential state.</text>
  <text x="392" y="670" class="body fine">One signed end-verifiable record</text>
  <text x="392" y="694" class="body fine">or a graph of related signed</text>
  <text x="392" y="718" class="body fine">records concerning a Digital</text>
  <text x="392" y="742" class="body fine">Artifact. It preserves portable</text>
  <text x="392" y="766" class="body fine">evidence of consequential</text>
  <text x="392" y="790" class="body fine">statements and lifecycle events.</text>
  <line x1="820" y1="650" x2="820" y2="842" class="rule"/>
  <text x="850" y="670" class="body-strong ink">Policy Validation</text>
  <text x="850" y="704" class="body fine">An applicable policy evaluates the DCR</text>
  <text x="850" y="728" class="body fine">or graph as a whole. Consequential state</text>
  <text x="850" y="752" class="body fine">is the result of that validation, not a</text>
  <text x="850" y="776" class="body fine">separate record or container.</text>
  <text x="850" y="816" class="body-strong ink">Recognition accepts that state and</text>
  <text x="850" y="840" class="body fine">determines its external effect.</text>

  <rect x="1340" y="568" width="220" height="300" rx="8" fill="url(#original)" filter="url(#shadow)"/>
  <text x="1362" y="602" class="card-title ink">Digital Original</text>
  <text x="1362" y="628" class="card-subtitle ink">Definition</text>
  <text x="1362" y="670" class="body fine">A Digital Artifact with</text>
  <text x="1362" y="694" class="body fine">consequential state</text>
  <text x="1362" y="718" class="body fine">established by policy</text>
  <text x="1362" y="742" class="body fine">validation of its DCR.</text>

  <rect x="40" y="888" width="500" height="86" rx="8" fill="#f6f8fb" filter="url(#shadow)"/>
  <text x="62" y="920" class="card-title ink">Transition Guards</text>
  <text x="62" y="950" class="body fine">Guards are conditions arising from current control state</text>
  <text x="62" y="972" class="body fine">that determine whether a proposed transition is valid.</text>

  <rect x="560" y="888" width="560" height="86" rx="8" fill="#f6f8fb" filter="url(#shadow)"/>
  <text x="582" y="920" class="card-title ink">Specification Language</text>
  <text x="582" y="950" class="body fine">The Control Layer is an expressive grammar for describing</text>
  <text x="582" y="972" class="body fine">control state, valid transitions, and transition guards.</text>

  <rect x="1140" y="888" width="420" height="86" rx="8" fill="#f6f8fb" filter="url(#shadow)"/>
  <text x="1162" y="920" class="card-title ink">Key Takeaway</text>
  <text x="1162" y="948" class="body-strong ink">Validate the DCR against policy.</text>
  <text x="1162" y="970" class="body fine">The resulting state enables effect.</text>
</svg>
