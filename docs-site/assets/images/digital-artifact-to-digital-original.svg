<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">The OpenETR Model</title>
  <desc id="desc">The OpenETR model has three primitives: Digital Artifact, Digital Controllable Record, and Digital Original. Consequential State is the core concept. Recognition can give consequential state external effect.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="artifact" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7f3ff"/>
      <stop offset="1" stop-color="#f6fbff"/>
    </linearGradient>
    <linearGradient id="dcr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddf6e7"/>
      <stop offset="1" stop-color="#f2fbf5"/>
    </linearGradient>
    <linearGradient id="original" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffefb7"/>
      <stop offset="1" stop-color="#fff8df"/>
    </linearGradient>
    <linearGradient id="state" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe7ff"/>
      <stop offset="1" stop-color="#f8f4ff"/>
    </linearGradient>
    <linearGradient id="recognition" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8e6f2"/>
      <stop offset="1" stop-color="#fff5fb"/>
    </linearGradient>
    <linearGradient id="effect" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f6f0"/>
      <stop offset="1" stop-color="#f6fcf9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#183153" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24324a"/>
    </marker>
    <style>
      .ink { fill: #081731; }
      .muted { fill: #536273; }
      .blue { fill: #263d61; }
      .green { fill: #2e6c59; }
      .gold { fill: #7a5400; }
      .purple { fill: #4d3c7d; }
      .title { font: 800 58px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .subtitle { font: 500 30px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .label { font: 800 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 6px; }
      .card-title { font: 800 30px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .card-subtitle { font: 500 23px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .body { font: 500 21px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .small { font: 500 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .footer-title { font: 800 25px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 8px; }
      .brand { font: 800 31px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .brand-sub { font: 700 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 5px; }
      .arrow { stroke: #24324a; stroke-width: 4; stroke-linecap: round; fill: none; marker-end: url(#arrow); }
      .soft-arrow { stroke: #5d6b7d; stroke-width: 3; stroke-linecap: round; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 10; }
      .icon-line { stroke: currentColor; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <text x="800" y="72" text-anchor="middle" class="title ink">The OpenETR Model</text>
  <text x="800" y="120" text-anchor="middle" class="subtitle muted">Three primitives. One core concept. Verifiable consequences.</text>

  <rect x="50" y="158" width="365" height="400" rx="16" fill="url(#artifact)" filter="url(#shadow)"/>
  <text x="232" y="194" text-anchor="middle" class="label blue">PRIMITIVE 1</text>
  <text x="232" y="238" text-anchor="middle" class="card-title ink">Digital Artifact</text>
  <text x="232" y="274" text-anchor="middle" class="card-subtitle ink">Uniquely identifiable content.</text>
  <g transform="translate(174 318)" color="#0b2347">
    <path class="icon-line" d="M20 0h80l34 34v116H20z"/>
    <path class="icon-line" d="M100 0v36h34"/>
    <path class="icon-line" d="M42 56h54"/>
    <path class="icon-line" d="M42 78h72"/>
    <path class="icon-line" d="M42 100h64"/>
    <path class="icon-line" d="M42 122h48"/>
  </g>
  <text x="232" y="482" text-anchor="middle" class="body ink">The content.</text>

  <rect x="562" y="158" width="456" height="400" rx="16" fill="url(#dcr)" filter="url(#shadow)"/>
  <text x="790" y="194" text-anchor="middle" class="label green">PRIMITIVE 2</text>
  <text x="790" y="238" text-anchor="middle" class="card-title ink">Digital Controllable Record</text>
  <text x="790" y="274" text-anchor="middle" class="card-subtitle ink">End-verifiable evidence.</text>
  <g transform="translate(704 308)" color="#245c4e">
    <rect class="icon-line" x="0" y="32" width="100" height="112" rx="10"/>
    <rect class="icon-line" x="22" y="12" width="100" height="112" rx="10"/>
    <path class="icon-line" d="M62 0h106l26 26v118H62z"/>
    <path class="icon-line" d="M168 0v28h26"/>
    <circle class="icon-line" cx="110" cy="56" r="13"/>
    <circle class="icon-line" cx="92" cy="96" r="11"/>
    <circle class="icon-line" cx="112" cy="132" r="13"/>
    <circle class="icon-line" cx="168" cy="94" r="13"/>
    <path class="icon-line" d="M110 69l-18 27 20 36 56-38-58-38"/>
    <path class="icon-line" d="M82 64H56M76 88H56M78 118H56"/>
  </g>
  <text x="790" y="462" text-anchor="middle" class="body ink">A record or graph of events</text>
  <text x="790" y="490" text-anchor="middle" class="body ink">that establishes and transitions</text>
  <text x="790" y="518" text-anchor="middle" class="body ink">state concerning the artifact.</text>

  <rect x="1170" y="158" width="380" height="400" rx="16" fill="url(#original)" filter="url(#shadow)"/>
  <text x="1360" y="194" text-anchor="middle" class="label gold">PRIMITIVE 3</text>
  <text x="1360" y="238" text-anchor="middle" class="card-title ink">Digital Original</text>
  <text x="1360" y="274" text-anchor="middle" class="card-subtitle ink">A Digital Artifact with</text>
  <text x="1360" y="304" text-anchor="middle" class="card-subtitle ink">consequential state.</text>
  <g transform="translate(1290 332)" color="#805600">
    <path class="icon-line" d="M20 0h86l28 28v118H20z"/>
    <path class="icon-line" d="M106 0v30h28"/>
    <path class="icon-line" d="M46 54h48M46 78h58M46 102h44"/>
    <circle cx="126" cy="90" r="28" fill="#ffc43b" stroke="#805600" stroke-width="4"/>
    <path d="M112 116l-10 50 24-16 24 16-10-50" fill="#ffc43b" stroke="#805600" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <path class="arrow" d="M435 344h108"/>
  <text x="489" y="387" text-anchor="middle" class="small ink">Referenced by</text>
  <path class="arrow" d="M1040 344h104"/>
  <text x="1092" y="387" text-anchor="middle" class="small ink">Establishes</text>
  <text x="1092" y="411" text-anchor="middle" class="small ink">consequential state</text>

  <rect x="316" y="646" width="600" height="180" rx="16" fill="url(#state)" filter="url(#shadow)"/>
  <text x="616" y="688" text-anchor="middle" class="label purple">CORE CONCEPT</text>
  <text x="616" y="728" text-anchor="middle" class="card-title ink">Consequential State</text>
  <text x="616" y="764" text-anchor="middle" class="body ink">State resulting from consequential actions</text>
  <text x="616" y="792" text-anchor="middle" class="body ink">that can, when recognized, produce effect.</text>

  <path class="soft-arrow" d="M236 575c8 76 42 118 82 137"/>
  <text x="352" y="614" class="small ink">Concerns the artifact</text>
  <path class="soft-arrow" d="M790 578v50"/>
  <text x="820" y="596" class="small ink">Events are evaluated by</text>
  <text x="820" y="620" class="small ink">state transition rules</text>
  <path class="soft-arrow" d="M950 578c-2 40-12 68-34 92"/>
  <text x="975" y="610" class="small ink">Makes the artifact</text>
  <text x="975" y="634" class="small ink">a digital original</text>

  <rect x="1142" y="616" width="188" height="236" rx="12" fill="url(#recognition)" filter="url(#shadow)"/>
  <text x="1236" y="650" text-anchor="middle" class="label purple" style="letter-spacing:3px">RECOGNITION</text>
  <g transform="translate(1197 674)" color="#2b2459">
    <path class="icon-line" d="M0 48h78M8 48V94M70 48V94M28 48V94M50 48V94M0 94h78M8 42l31-20 31 20z"/>
  </g>
  <text x="1236" y="786" text-anchor="middle" class="small ink">Accepts the state</text>
  <text x="1236" y="810" text-anchor="middle" class="small ink">for a purpose.</text>

  <rect x="1378" y="616" width="172" height="236" rx="12" fill="url(#effect)" filter="url(#shadow)"/>
  <text x="1464" y="650" text-anchor="middle" class="label green" style="letter-spacing:3px">EFFECT</text>
  <g transform="translate(1426 688)" color="#194d42">
    <circle class="icon-line" cx="38" cy="38" r="34"/>
    <path class="icon-line" d="M18 20c14 8 12 18 0 24M52 12c-12 8-10 20 4 24M34 70c4-16 18-16 26-26"/>
  </g>
  <text x="1464" y="786" text-anchor="middle" class="small ink">Legal, regulatory,</text>
  <text x="1464" y="810" text-anchor="middle" class="small ink">contractual, or</text>
  <text x="1464" y="834" text-anchor="middle" class="small ink">other effect.</text>

  <path class="soft-arrow dashed" d="M926 736h190"/>
  <text x="986" y="770" class="small ink">When recognized</text>
  <path class="arrow" d="M1334 734h38"/>

  <line x1="50" y1="886" x2="1550" y2="886" stroke="#9aa8bb" stroke-width="1.5"/>
  <text x="800" y="930" text-anchor="middle" class="footer-title muted">A SIMPLE IDEA WITH WIDE APPLICATION</text>
  <text x="800" y="966" text-anchor="middle" class="subtitle muted">Actions have consequences. OpenETR makes evidence of consequential actions end-verifiable.</text>
  <text x="1464" y="932" text-anchor="middle" class="brand ink">OpenETR</text>
  <text x="1464" y="958" text-anchor="middle" class="brand-sub muted">PORTABLE CONSEQUENCES</text>
</svg>
