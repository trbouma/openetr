<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OpenETR</title>
  <desc id="desc">The OpenETR logo with the words Portable control for transferable records.</desc>
  <rect width="1200" height="630" fill="#edf3ff"/>
  <rect y="610" width="1200" height="20" fill="#e4a53a"/>
  <rect x="118" y="116" width="342" height="342" rx="40" fill="#ffffff" fill-opacity=".91" stroke="#2f66d8" stroke-opacity=".28" stroke-width="3"/>
  <image href="openetr.png" x="130" y="128" width="318" height="318" preserveAspectRatio="xMidYMid meet"/>
  <text x="555" y="308" fill="#173b78" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="700">OpenETR</text>
  <text x="560" y="352" fill="#2f66d8" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="600">Portable control for</text>
  <text x="560" y="396" fill="#2f66d8" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="600">transferable records.</text>
  <text x="562" y="450" fill="#173b78" font-family="Arial, Helvetica, sans-serif" font-size="25">Signed events. Digest-addressed objects.</text>
  <text x="562" y="484" fill="#173b78" font-family="Arial, Helvetica, sans-serif" font-size="25">Independent verification.</text>
</svg>
